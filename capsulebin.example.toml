# CapsuleBin example configuration.
#
# Every value below is the built-in default unless noted. Copy this file, adjust
# it, and start with `capsulebin --config capsulebin.toml serve`.
#
# Two things to know:
#
#   * Unknown keys are a startup error, not a warning. A typo would otherwise
#     leave a setting silently inactive.
#   * Every setting can be overridden by an environment variable named
#     CAPSULEBIN__<TABLE>__<KEY>, for example CAPSULEBIN__SERVER__BIND. That is
#     the intended way to inject values in a container.
#
# Verify a file without opening a port:  capsulebin --config capsulebin.toml check

[server]
bind = "127.0.0.1:8080"

# Required, no default. The externally reachable base URL, without a trailing
# slash. It appears in problem+json "type" URIs and in generated share links, so
# it is taken from configuration rather than from a request header - a Host header
# is attacker-controlled. The web interface needs the instance at the root of its
# own host: it loads /assets/, calls /api/ and creates links directly under the
# origin. A query or fragment, also an empty one (https://example.org/team?), is
# refused at startup: paths are appended to the URL as text. The path must not
# end in an interface language code (exactly "en" or "de", e.g.
# https://example.org/team/de): links below it would be ambiguous with the
# /<lang>/ prefix of the pages, so the server refuses to start.
public_url = "https://paste.example"

# Development only: serve assets from a directory instead of the embedded copy.
# Leave unset in production, where the binary is self-contained.
# asset_dir = "src/server/web/dist"

# CIDR ranges of reverse proxies whose X-Forwarded-For is trusted to name the
# real client IP - the address rate limiting keys on. Empty (the default) means
# only the TCP peer address is used, which is correct when capsulebin is reached
# directly. Behind a reverse proxy, list the proxy's own address or subnet, not
# the clients'. Each entry needs a prefix length ("127.0.0.1/32", "::1/128");
# anything else is a startup error:
# trusted_proxies = ["127.0.0.1/32"]
trusted_proxies = []

[database]
# Must be on a local filesystem. The write-ahead log is not reliable over NFS.
path = "capsulebin.db"

# SQLite allows one writer at a time. Without a timeout a concurrent write fails
# immediately instead of waiting, so zero is rejected.
busy_timeout_ms = 5000

# "full" | "normal" | "off". Only "full" guarantees an acknowledged write survives
# a power loss. For one-time pastes that loss would be unrecoverable, and at this
# data volume the cost is negligible - change it only with a specific reason.
synchronous = "full"

[pastes]
# Applied when a request does not specify an expiry.
default_expiry = "7d"

# Upper bound a request may ask for. Must not be below default_expiry.
maximum_expiry = "90d"

# Whether a paste may be created with no expiry at all. Off by default: an
# accountless service accumulating permanent content is a moderation problem.
allow_permanent = false

# Plaintext budget per capsule. The server cannot measure plaintext - it never
# sees any - so this is enforced against the ciphertext size plus a fixed
# allowance for authentication overhead. Binary units only: "10MiB", not "10MB".
max_plaintext_size = "10MiB"

# Limit on the opaque public header a client may store. This is the one
# client-supplied blob returned on an unauthenticated descriptor request, so it is
# kept small; 4KiB is the highest accepted value.
max_public_header_size = "2KiB"

# There is deliberately no setting for the number of items in a capsule or for
# which kinds of files it may hold: the server never sees inside a capsule, so
# such a limit could only be honoured voluntarily by a client.

[purge]
# Retention. The purge job removes whole rows - the metadata goes with the
# capsule, not just the payload.
#
# There is deliberately no interval setting. The job runs once after startup and
# then once a day; what an operator configures is *what* is removed, not how often
# the question is asked. `capsulebin prune` applies the same rules on demand.
enabled = true

# A capsule nobody ever retrieved is measured from its creation.
never_retrieved_after = "30d"

# A capsule that was retrieved is measured from the last authorized retrieval. A
# capsule created without an expiry is not exempt: "no fixed expiry" means the
# creator named no deadline, not that the instance keeps it forever.
inactive_after = "90d"

# How coarsely the last-retrieval timestamp is advanced. One write per window
# instead of one per request; the inactivity measurement becomes correspondingly
# imprecise, which the thresholds above are far too coarse to notice. Must not
# exceed inactive_after.
retrieval_timestamp_granularity = "1h"

# Rows removed per rule per statement. The job keeps going until a pass removes
# nothing, so this bounds a single write, not the total.
batch_size = 500

[creation]
# "token" | "public" | "disabled"
#
#   token     a bearer token from token_hashes is required
#   public    anyone may create; only sensible behind another access control
#   disabled  read-only instance: existing pastes stay retrievable
#
# "token" is the default so that an instance reachable before it is configured is
# not an open write target.
mode = "token"

# SHA-256 of each accepted token, base64url without padding. The plain token is
# never stored here, so this file does not need to be treated as a secret store.
#
# Generate a token and its entry with:
#
#   capsulebin token
#
# The hash is domain-separated, so `sha256sum` of the token alone will not match.
# Several entries are allowed, which is how a token is rotated: add the new hash,
# switch clients over, then remove the old one.
token_hashes = []

[rate_limits]
# Per-endpoint-class, per-client-IP token buckets. `requests_per_minute = 0`
# (the default for every per-client class below) disables limiting for that
# class. The one limit on by default is invalid_capability_per_paste, which is
# keyed by paste id rather than client IP. In-memory only: a restart resets every
# counter, which is fine for a single instance and out of scope for a fleet.
#
# The client IP a bucket keys on is the TCP peer address unless it is listed in
# server.trusted_proxies, in which case X-Forwarded-For is trusted instead - set
# that first, or every request behind a reverse proxy shares one bucket.
#
# A rate is either `requests_per_minute` or `requests_per_hour` (for classes
# whose sensible rate is below one a minute), never both; a class with a rate
# needs `burst >= 1`. A rejected request gets 429 with Retry-After (seconds
# until the next token) and code "rate_limited".

[rate_limits.create]
requests_per_minute = 0
burst = 0
# Request bytes per client IP per day, refilled continuously (e.g. "100MiB").
# Charged with the request's Content-Length before anything is stored, so a few
# maximum-size uploads cannot hide behind the request rate. While set, a create
# without Content-Length is refused with 411. Off unless set.
# bytes_per_day = "100MiB"
# Create requests in flight per client IP (e.g. 2).
max_concurrent = 0

[rate_limits.descriptor]
requests_per_minute = 0
burst = 0

[rate_limits.retrieve]
requests_per_minute = 0
burst = 0

[rate_limits.delete]
requests_per_minute = 0
burst = 0

[rate_limits.invalid_capability_per_paste]
# Wrong passwords for ONE paste, from any address: retrieves that prove the
# link (correct describe token) but fail the reveal token. Callers with only
# the id never count against it and never see its 429.
# On by default: it is what protects a capsule's password once its link has
# leaked (every guess needs a retrieve), and unlike the per-client limits it
# does not depend on trusted_proxies being right. 0 disables it.
requests_per_minute = 10
burst = 10

[rate_limits.invalid_capability]
# Describes, retrieves and deletes answered with 404 - unknown id, wrong capability,
# expired, moderated, all alike. Each costs a token; with the bucket empty,
# further requests of these kinds from that client are refused with 429 before
# any lookup. Legitimate use almost never fails, so e.g. 10 per minute with a
# burst of 10 throttles guessing without getting in anyone's way.
requests_per_minute = 0
burst = 0

[rate_limits.report]
# POST /api/v1/reports. Reports are rare; once this is on, something like
# 5 per hour with a burst of 2 is plenty.
requests_per_hour = 0
burst = 0

[abuse]
# Notice and action (ADR-013). Anyone can report a capsule by id on /report;
# the operator handles reports with `capsulebin reports ...` and blocks or
# removes capsules with `capsulebin moderation ...` - without decrypting them.
# A moderated capsule answers exactly like an unknown one; there is no notice.

# Accept reports at POST /api/v1/reports. Moderation works either way.
enabled = true

# Shown on the report page as an out-of-band channel (an address or a URL).
# contact = "abuse@paste.example"

# How long closed reports and moderation records are kept. Reports contain
# free text and contact details from the public - personal data. Open reports
# stay until they are closed.
report_retention = "90d"

# Ceilings on open reports (status open or reviewing), so nobody who knows an
# id can grow the queue and the database without bound. A report above a
# ceiling is not stored, and the reporter gets the same answer as for a stored
# one; the server logs a warning (at most once a minute) and
# `capsulebin reports list` shows the count. Closing a report frees its place.
# Integers of at least 1; to stop taking reports, set `enabled = false`.
# Open reports about one capsule:
max_open_reports_per_paste = 10
# Open reports on the whole instance:
max_open_reports = 1000

[i18n]
# The default interface language, one of "en" and "de". Its pages have no
# language prefix (/, /p/<id>, /report); every other language is always offered
# under its prefix (/de/, /de/p/<id>). Paths under the prefix of the default
# language are redirected to the ones without it. This is the only key here:
# which languages are offered is not configurable.
default_language = "en"

[branding]
# The identity of the instance in its web pages. Not used by the CLI, the API
# or the logs.

# Shown in place of "CapsuleBin" in the page titles, the header and the texts
# that name the service, in every language. Leading and trailing spaces are
# dropped; at most 64 characters, no control characters.
name = "CapsuleBin"

# Show only the logo in the header, without the name next to it (the name stays
# in the page titles and is the logo's text alternative). Requires logo.
hide_name = false

# The slogan next to the logo on the create page, in place of the built-in,
# translated one; the same text in every language without its own (see
# [branding.<lang>] below). An empty string removes the slogan. Leading and
# trailing spaces are dropped; at most 80 characters, no control characters.
# Without it, the built-in slogan in the page's language.
# tagline = "Encrypted pastes for the team"

# Image files, read once at startup: after replacing a file, restart the
# server. A relative path is resolved against the working directory, like
# database.path. Each file at most 256 KiB, checked by extension and content;
# SVG is not accepted. Each file is served at /branding/<hash>.<ext>.
#
# Replaces the built-in symbol in the header: PNG or WebP (.png, .webp). A PNG
# at twice the display height (1.5rem) stays sharp on high-density screens.
# logo = "/etc/capsulebin/branding/logo.png"
# The logo in the dark theme, PNG or WebP. Requires logo; without it the one
# logo is shown in both themes.
# logo_dark = "/etc/capsulebin/branding/logo-dark.webp"
# The favicon: PNG or ICO (.png, .ico). Without it, the built-in CapsuleBin
# symbol.
# favicon = "/etc/capsulebin/branding/favicon.png"

# Every page links "Powered by CapsuleBin" to the source code of the software
# the instance runs (AGPL-3.0, section 13); the link opens in a new tab. It
# cannot be switched off; if you run a modified version, point it to your
# source code. An absolute http(s) URL without user name or password.
source_url = "https://github.com/capsulebin/capsulebin"

# The tagline of one language other than i18n.default_language, e.g. German
# (/de/): replaces branding.tagline in that language's pages. Fallback order:
# this table's tagline, then branding.tagline, then the built-in slogan. An
# empty string removes the slogan in that language only. A table for an
# unknown language or for the default language (whose tagline is
# branding.tagline) and any key but tagline stop the start.
# [branding.de]
# tagline = "Verschlüsselte Pastes fürs Team"

# The colours of the light and the dark theme, in place of the built-in ones.
# Each key sets one colour token of the built-in theme (key x_y: token
# --cb-x-y); a key left out keeps its built-in value, shown below. A value is
# "#rgb" or "#rrggbb" (hex digits in either case, nothing around them); any
# other value and any other key stop the start. Read once at startup: after a
# change, restart the server. The system preference and the theme toggle keep
# working with these colours in both directions.
#
# A pair below the contrast the built-in theme holds is a warning in the log
# of serve and in the output of `capsulebin check`, not an error: text,
# text_muted, accent, danger, warning and success on bg, surface and
# surface_sunken, and accent_text on accent, at least 4.5:1; border_strong on
# bg, surface and surface_sunken, and focus_ring on bg, at least 3:1.
# [branding.colors.light]
# bg = "#fbfcfc"
# surface = "#ffffff"
# surface_sunken = "#f2f5f5"
# border = "#dbe3e2"
# border_strong = "#7d8e8c"
# text = "#0d1b1a"
# text_muted = "#4a5c5a"
# accent = "#0f766e"
# accent_hover = "#115e59"
# accent_text = "#ffffff"
# danger = "#b42318"
# warning = "#b45309"
# success = "#067647"
# focus_ring = "#0f766e"
# tint_accent = "#e6f2f1"
# tint_danger = "#fdecea"
# tint_warning = "#fdf3e5"
# tint_success = "#e6f4ee"
#
# [branding.colors.dark]
# bg = "#0c1413"
# surface = "#131e1d"
# surface_sunken = "#0f1a19"
# border = "#263735"
# border_strong = "#587471"
# text = "#e6efee"
# text_muted = "#9db0ae"
# accent = "#2dd4bf"
# accent_hover = "#5eead4"
# accent_text = "#08201e"
# danger = "#f97066"
# warning = "#f79009"
# success = "#47cd89"
# focus_ring = "#2dd4bf"
# tint_accent = "#10322e"
# tint_danger = "#33150f"
# tint_warning = "#2e1e05"
# tint_success = "#0e2a1d"

[legal]
# The operator's legal pages: an imprint, a privacy notice and terms of use,
# served by CapsuleBin at /imprint, /privacy and /terms (and under the prefix of
# every other language, /de/imprint) and linked from the footer of every page.
# An instance open to the public in the EU usually needs at least an imprint
# and a privacy notice.
#
# Each text is Markdown, given inline (text = """...""") or read from a file at
# startup (file = "..."), or a link to a page hosted elsewhere (url = "...").
# Raw HTML in the Markdown is shown as text; links may point to http(s),
# mailto, tel and paths on this host. Without [legal.operator] there are no
# legal pages and no footer links (unless privacy or terms are set explicitly).
# docs/privacy-notice.md describes the built-in texts.

# Who runs the instance: name, address, contact, register entry - the imprint.
# [legal.operator]
# file = "/etc/capsulebin/legal/operator.md"

# Who hosts it, if that is someone else: a second block in the imprint, and
# named as processor (Art. 28 GDPR) in the built-in privacy notice.
# [legal.hosting]
# text = """Example Hosting Ltd., Server Street 2, 12345 City"""

# Privacy notice. Without text, file or url, the built-in notice is used: it
# describes what CapsuleBin processes, with the retention periods and limits
# configured above. `extra` / `extra_file` add what it cannot know - the
# reverse proxy's logs, backups, a data protection officer.
# [legal.privacy]
# extra = """
# ## Web server logs
# Our reverse proxy logs IP addresses for 7 days to fend off attacks.
# """

# Terms of use. Without text, file or url, the built-in rules of use are used;
# `extra` / `extra_file` add to them.
# [legal.terms]
# url = "https://example.org/terms"

# Texts in another interface language: [legal.<lang>.operator], .hosting,
# .privacy and .terms, for every known language except i18n.default_language,
# with the same keys and rules as above (env: CAPSULEBIN__LEGAL__DE__OPERATOR__TEXT).
# [legal.*] itself is the text of the default language; [legal.en] with the
# default "en" is an error. A section of its own replaces the [legal.*] one as
# a whole in that language's pages - an empty [legal.de.privacy] means the
# built-in German notice, without the [legal.privacy] text or extra. Where a
# language has no section of its own, the [legal.*] section is shown, marked
# with the default language (lang="en") for screen readers. The built-in
# privacy notice and terms always come in the page's language.
# [legal.de.operator] and [legal.de.hosting] need [legal.operator] and
# [legal.hosting]: every language names the same operator and hosting provider.
# [legal.de.operator]
# file = "/etc/capsulebin/legal/operator.de.md"
#
# [legal.de.privacy]
# extra = """
# ## Logs des Webservers
# Unser Reverse Proxy speichert IP-Adressen 7 Tage lang, um Angriffe abzuwehren.
# """
