# CapsuleBin CI
#
# Every job is a required check for main (AGENTS.md, "Required checks").
#
# Third-party actions are pinned to a full commit SHA with the release tag as a
# comment; Dependabot keeps the pins current (.github/dependabot.yml). The Rust
# version lives only in rust-toolchain.toml, which rustup reads.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so that a new advisory against an unchanged lockfile or an
    # approaching end of support still shows up. Only the audit and support jobs
    # run on this trigger.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Debug symbols only cost time and disk space here.
  CARGO_PROFILE_DEV_DEBUG: none
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        # Installs the version from rust-toolchain.toml, including the rustfmt
        # and clippy components listed there.
        run: |
          rustup toolchain install
          rustc --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Cheap checks first, so the common mistakes fail before the test build.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The two invariant suites run as their own steps so that a failure names
      # the invariant. The full run below repeats them at negligible cost.
      - name: No plaintext in the database
        run: cargo test --locked -p capsulebin-server --test db_no_plaintext

      - name: No secrets in the logs
        run: cargo test --locked -p capsulebin-server --test logging

      - name: Tests
        run: cargo test --workspace --locked

  typescript:
    name: TypeScript
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: |
          npm run check -w @capsulebin/core
          npm run check -w @capsulebin/web
          npm run check -w @capsulebin/cli

      # @capsulebin/core's suite includes the golden vectors from
      # docs/test-vectors/; @capsulebin/web's includes the contrast checks for the
      # design tokens and the checks that the HTML shells carry no inline scripts
      # or styles.
      - name: Tests
        run: |
          npm test -w @capsulebin/core
          npm test -w @capsulebin/web
          npm test -w @capsulebin/cli

      - name: Build
        run: |
          npm run build -w @capsulebin/web
          npm run build -w @capsulebin/cli

      - name: Upload web assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: src/server/web/dist
          if-no-files-found: error
          retention-days: 1

      # The bundled CLI, so the acceptance job can drive the release binary with
      # the real client crypto.
      - name: Upload CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist
          path: src/cli/dist
          if-no-files-found: error
          retention-days: 1

  # The baseline above is the oldest Node.js the CLI supports (.node-version).
  # Users run the CLI on whatever Node.js they have, so the tests also run on the
  # newest LTS. Raise this together with the support windows below.
  typescript-current:
    name: TypeScript (Node 26)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Tests
        run: |
          npm test -w @capsulebin/core
          npm test -w @capsulebin/web
          npm test -w @capsulebin/cli

  acceptance:
    name: Acceptance (release binary)
    if: github.event_name != 'schedule'
    needs: typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The binary embeds src/server/web/dist at compile time, so the assets have
      # to be in place before cargo runs.
      - name: Fetch web assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: src/server/web/dist

      - name: Fetch CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-dist
          path: src/cli/dist

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release

      - name: Release build
        run: cargo build --release --locked -p capsulebin-server

      # Starts the binary and asserts that the embedded application, the health
      # endpoints and every security header respond as expected, including on the
      # 404 path. With CAPSULEBIN_CLI set it also takes capsules through the
      # bundled CLI's put/get/delete against the binary.
      - name: Acceptance check
        env:
          CAPSULEBIN_CLI: src/cli/dist/cli.js
        run: ./scripts/smoke.sh ./target/release/capsulebin

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capsulebin-linux-amd64
          path: target/release/capsulebin
          if-no-files-found: error
          retention-days: 7

  # The shipped bundle in real engines, under the server's CSP and Trusted
  # Types, against the release binary from the acceptance job
  # (src/server/web/e2e, playwright.config.ts).
  #
  # It runs in Playwright's image, which carries the engines and their system
  # libraries: installing those with apt on the runner hung for 20 minutes more
  # than once. The image tag has to name the locked @playwright/test version;
  # when they differ, Playwright stops with a message saying to update the
  # image. --user 1001 is the runner's own user, as Playwright recommends.
  browser:
    name: Browser (Chromium, Firefox, WebKit)
    if: github.event_name != 'schedule'
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Fetch binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: capsulebin-linux-amd64
          path: target/release

      - name: Executable
        run: chmod +x target/release/capsulebin

      - name: Browser tests
        run: npm run e2e -w @capsulebin/web

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-report
          path: |
            src/server/web/playwright-report
            src/server/web/test-results
          retention-days: 7

  container:
    name: Container image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # No .dockerbuild record artifact; the job summary shows the build.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: capsulebin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image as an operator runs it: environment only, a fresh volume, the
      # built-in health check. Healthy means assets, database and schema are
      # usable as the non-root user.
      - name: Run
        run: |
          hash="$(docker run --rm capsulebin:ci token | grep -o 'sha256:[A-Za-z0-9_-]*' | head -1)"
          docker run -d --name capsulebin -p 127.0.0.1:8080:8080 -v capsulebin-data:/data \
            -e CAPSULEBIN__SERVER__PUBLIC_URL=https://paste.example \
            -e CAPSULEBIN__CREATION__TOKEN_HASHES="[\"${hash}\"]" \
            --health-interval 2s \
            capsulebin:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' capsulebin)" = healthy ] && break
            sleep 2
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' capsulebin)" != healthy ]; then
            docker logs capsulebin
            exit 1
          fi
          test "$(docker inspect --format '{{.Config.User}}' capsulebin)" = "65532:65532"
          curl -fsS http://127.0.0.1:8080/health/ready
          echo
          docker exec capsulebin /usr/local/bin/capsulebin backup --output /data/ci-backup.db

  # Node.js and the Debian base images have an end of support. This warns half a
  # year (Debian: a year) before it and fails three months (Debian: six) before,
  # and checks that every place naming the Node.js version agrees with
  # .node-version. Runs on the weekly schedule too, so the warning arrives without
  # a code change.
  support:
    name: Support windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Support windows
        run: node scripts/support-windows.mjs

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.21.0

      # Advisories, licences, bans and sources. Accepted exceptions are listed in
      # deny.toml together with the condition for removing them.
      - name: cargo deny
        run: cargo deny check

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Reads package-lock.json; no install needed.
      - name: npm audit
        run: npm audit --audit-level=high
