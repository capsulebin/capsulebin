# Version updates for Cargo, npm, the Dockerfile's base images and the workflow
# actions. Security updates are enabled separately in the repository settings
# and are not delayed.
#
# A new release has to be a week old before it is proposed, so a compromised or
# broken version has time to be yanked first.
#
# Commit messages and pull request titles follow Conventional Commits
# (CONTRIBUTING.md): `build(deps): ...` and `build(deps-dev): ...` for
# dependencies and base images,
# `ci(deps): ...` for workflow actions.
#
# Runtime versions are not Dependabot's to move: the Node.js major lives in
# .node-version, the Rust version in rust-toolchain.toml, and the Support
# windows CI job says when they need to change. Updates that would move them
# on their own are ignored below.

version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Types for the Node.js major in .node-version, not the newest one.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Base image digests in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The build image follows .node-version.
      - dependency-name: library/node
        update-types: ['version-update:semver-major']
      # The Rust image follows rust-toolchain.toml; rustup would install the
      # pinned toolchain anyway. Only its digest is updated.
      - dependency-name: library/rust
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ci
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
