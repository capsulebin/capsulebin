[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Each entry is a deliberate, reviewed exception and names the condition under
# which it is removed again.
ignore = [
    # SQLite < 3.54 can return uninitialised page-cache memory when it opens a
    # database together with a crafted `-wal` file of a different page size. Fixed
    # in libsqlite3-sys 0.39, but sqlx-sqlite 0.9.0 (latest) pins < 0.38, so it
    # cannot be updated yet. Exposure: only a database + WAL pair written by a less
    # trusted party. CapsuleBin opens only its own data directory; the residual
    # case - restoring a backup from an untrusted source - is documented as
    # unsupported in the README. Interim measure: restore copies only the backup's
    # main file and runs verification on a private standalone copy, so a `-wal`
    # next to the backup never reaches SQLite. Remove once sqlx allows
    # libsqlite3-sys >= 0.39.
    { id = "RUSTSEC-2026-0459", reason = "SQLite WAL page-size bug; only reachable with an untrusted database file; interim: restore verifies a private standalone copy of the main file only; remove once sqlx allows libsqlite3-sys >= 0.39" },
]

[licenses]
version = 2
# Dependencies must be permissively licensed. CapsuleBin itself is AGPL-3.0-only,
# which allows permissive upstreams but no GPL-incompatible copyleft anywhere in
# the dependency chain.
allow = [
    # The workspace crates themselves. Without this entry the check rejects our own
    # source, which is the one licence the list must not object to.
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# A dependency without a version requirement resolves to whatever is published, so
# it stays denied. Path dependencies inside this workspace are exempt: they resolve
# to the checked-out source rather than a published version.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
