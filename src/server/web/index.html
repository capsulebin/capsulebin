<!doctype html>
<html lang="{{lang}}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <meta name="referrer" content="no-referrer" />
        <title>{{name}}</title>
        <meta name="capsulebin-languages" content="{{languages}}" data-default="{{default}}" />
        <meta name="capsulebin-creation" content="{{creation}}" />
        <meta name="color-scheme" content="light dark" />
        <link rel="icon" href="{{favicon}}" />
        <script src="/theme-init.js"></script>
        <script src="/language-init.js"></script>
        <script type="module" src="/src/i18n/register-{{lang}}.ts"></script>
        <script type="module" src="/src/pages/create.ts"></script>
    </head>
    <body>
        <header class="cb-head">
            <a class="cb-logo" href="{{prefix}}/">
                <!--capsulebin:logo-->
                <svg width="18" height="20" viewBox="0 0 18 20" fill="none" aria-hidden="true">
                    <path
                        d="M9 1.2 16.4 5.4v9.2L9 18.8 1.6 14.6V5.4L9 1.2Z"
                        stroke="currentColor"
                        stroke-width="1.6"
                    />
                    <path
                        d="M6.2 9.4h5.6v4.2H6.2V9.4Zm1.1 0V7.9a1.7 1.7 0 0 1 3.4 0v1.5"
                        stroke="currentColor"
                        stroke-width="1.3"
                    />
                </svg>
                <!--/capsulebin:logo-->
                <!--capsulebin:wordmark-->
                <span class="cb-logo-name">{{name}}</span>
                <!--/capsulebin:wordmark-->
            </a>
            <!--capsulebin:tagline-->
            <span class="cb-claim">{{create.claim}}</span>
            <!--/capsulebin:tagline-->
            <span class="cb-push cb-head-tools">
                <nav
                    class="cb-lang"
                    aria-label="{{shell.language}}"
                    data-language-switch
                    hidden
                ></nav>
                <button
                    type="button"
                    class="cb-quiet"
                    data-theme-toggle
                    aria-label="{{theme.switch}}"
                >
                    <svg class="cb-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <circle cx="8" cy="8" r="5.8" />
                        <path class="cb-icon-solid" d="M8 2.2v11.6A5.8 5.8 0 0 0 8 2.2Z" />
                    </svg>
                </button>
            </span>
        </header>

        <main class="cb-main" data-create-root></main>

        <noscript>
            <div class="cb-main">
                <h1 class="cb-h1">{{shell.needsJavaScript}}</h1>
                <p class="cb-lede">{{create.noscript}}</p>
            </div>
        </noscript>

        <footer class="cb-foot">
            <span>{{shell.encryptedInBrowser}}</span>
            <span class="cb-push cb-foot-links">
                <a href="{{prefix}}/report">{{shell.reportContent}}</a>
                <!--capsulebin:legal-link:imprint:{{shell.imprint}}-->
                <!--capsulebin:legal-link:privacy:{{shell.privacy}}-->
                <!--capsulebin:legal-link:terms:{{shell.terms}}-->
                <span>{{shell.poweredBy}}</span>
            </span>
        </footer>

        <!-- templates ----------------------------------------------------------- -->

        <template id="tmpl-edit">
            <h1 class="cb-sr-only">{{create.heading}}</h1>
            <p class="cb-callout" role="status" data-token-notice hidden></p>
            <p class="cb-token-line" data-token-line hidden>
                <span data-token-line-text></span>
                <span aria-hidden="true">·</span>
                <button type="button" class="cb-btn-inline" data-token-forget>
                    {{create.token.forget}}
                </button>
            </p>
            <form class="cb-form cb-form--full cb-create-form" data-create-form novalidate>
                <label class="cb-sr-only" for="create-title">{{create.titleLabel}}</label>
                <input
                    id="create-title"
                    class="cb-input cb-create-title"
                    type="text"
                    maxlength="200"
                    autocomplete="off"
                    placeholder="{{create.titleLabel}}"
                    data-capsule-title
                />
                <div class="cb-editor-frame cb-create-editor" data-editor>
                    <div class="cb-create-head" data-editor-head>
                        <div class="cb-sheet-bar cb-create-bar" data-tabs-row>
                            <div
                                class="cb-itemtabs"
                                role="tablist"
                                aria-label="{{create.items}}"
                                data-item-tabs
                            ></div>
                            <div class="cb-create-menu cb-create-more" data-more hidden>
                                <button
                                    type="button"
                                    class="cb-quiet cb-create-all"
                                    aria-haspopup="menu"
                                    aria-expanded="false"
                                    aria-controls="cb-more-menu"
                                    data-more-btn
                                ></button>
                                <div
                                    id="cb-more-menu"
                                    class="cb-menu cb-create-all-menu"
                                    role="menu"
                                    data-more-menu
                                    hidden
                                ></div>
                            </div>
                            <div class="cb-create-menu" data-add>
                                <button
                                    type="button"
                                    class="cb-quiet cb-create-add"
                                    aria-haspopup="menu"
                                    aria-expanded="false"
                                    aria-controls="cb-add-menu"
                                    data-item-add
                                >
                                    {{create.addItem}}
                                </button>
                                <div
                                    id="cb-add-menu"
                                    class="cb-menu"
                                    role="menu"
                                    data-add-menu
                                    hidden
                                >
                                    <button type="button" role="menuitem" data-add-type="plain">
                                        {{create.type.plain}}
                                    </button>
                                    <button type="button" role="menuitem" data-add-type="code">
                                        {{create.type.code}}
                                    </button>
                                    <button type="button" role="menuitem" data-add-type="markdown">
                                        {{create.type.markdown}}
                                    </button>
                                    <button type="button" role="menuitem" data-add-type="download">
                                        {{create.type.download}}
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="cb-create-tools">
                            <label class="cb-sr-only" for="create-item-type"
                                >{{create.itemType}}</label
                            >
                            <select
                                id="create-item-type"
                                class="cb-input cb-select cb-input-sm"
                                data-item-type
                            >
                                <option value="plain">{{create.type.plain}}</option>
                                <option value="code">{{create.type.code}}</option>
                                <option value="markdown">{{create.type.markdown}}</option>
                                <option value="download">{{create.type.download}}</option>
                            </select>
                            <label class="cb-sr-only" for="create-item-name"
                                >{{create.itemName}}</label
                            >
                            <input
                                id="create-item-name"
                                class="cb-input cb-input-sm cb-item-name-input"
                                type="text"
                                maxlength="200"
                                spellcheck="false"
                                autocomplete="off"
                                placeholder="{{create.itemNamePlaceholder}}"
                                data-item-name
                            />
                            <label class="cb-sr-only" for="create-item-lang"
                                >{{create.codeLanguage}}</label
                            >
                            <select
                                id="create-item-lang"
                                class="cb-input cb-select cb-input-sm"
                                data-item-lang
                                hidden
                            >
                                <option value="plaintext">{{create.plainText}}</option>
                                <option value="bash">Bash</option>
                                <option value="css">CSS</option>
                                <option value="diff">Diff</option>
                                <option value="html">HTML</option>
                                <option value="ini">INI / TOML</option>
                                <option value="javascript">JavaScript</option>
                                <option value="json">JSON</option>
                                <option value="markdown">Markdown</option>
                                <option value="python">Python</option>
                                <option value="rust">Rust</option>
                                <option value="sql">SQL</option>
                                <option value="typescript">TypeScript</option>
                                <option value="yaml">YAML</option>
                            </select>
                            <span class="cb-bar-actions" data-item-actions>
                                <span
                                    class="cb-create-switch"
                                    role="group"
                                    aria-label="{{create.markdownEditor}}"
                                    data-preview-switch
                                    hidden
                                >
                                    <button
                                        type="button"
                                        class="cb-quiet"
                                        aria-pressed="true"
                                        data-preview-write
                                    >
                                        {{create.write}}
                                    </button>
                                    <button
                                        type="button"
                                        class="cb-quiet"
                                        aria-pressed="false"
                                        data-preview-show
                                    >
                                        {{create.preview}}
                                    </button>
                                </span>
                                <button type="button" class="cb-quiet" data-item-remove hidden>
                                    <span class="cb-bar-label">{{create.remove}}</span>
                                </button>
                            </span>
                        </div>
                    </div>

                    <div class="cb-item-panel" role="tabpanel" id="cb-create-panel" data-item-panel>
                        <textarea
                            class="cb-input cb-textarea cb-item-text"
                            rows="10"
                            maxlength="10485760"
                            placeholder="{{create.textPlaceholder}}"
                            aria-label="{{create.itemContent}}"
                            data-item-text
                        ></textarea>
                        <div class="cb-item-preview" data-item-preview hidden></div>
                        <div class="cb-drop" data-item-drop hidden>
                            <p data-item-drop-label>{{create.drop}}</p>
                            <button type="button" class="cb-btn-secondary" data-item-choose>
                                {{create.chooseFile}}
                            </button>
                            <input
                                type="file"
                                class="cb-item-file"
                                data-item-file
                                hidden
                                multiple
                            />
                        </div>
                    </div>
                    <div class="cb-create-foot">
                        <svg class="cb-size-bar" aria-hidden="true" focusable="false" data-size-bar>
                            <rect class="cb-size-track" width="100%" height="100%" rx="2" />
                            <rect
                                class="cb-size-fill"
                                width="0%"
                                height="100%"
                                rx="2"
                                data-size-fill
                            />
                        </svg>
                        <p class="cb-size-meter" data-size-meter></p>
                    </div>
                </div>

                <div class="cb-create-options">
                    <div class="cb-create-field">
                        <label class="cb-label" for="create-expiry">{{create.expires}}</label>
                        <select id="create-expiry" class="cb-input cb-select">
                            <option value="3600">{{create.expiry.hour}}</option>
                            <option value="86400">{{create.expiry.day}}</option>
                            <option value="604800" selected>{{create.expiry.week}}</option>
                            <option value="2592000">{{create.expiry.30days}}</option>
                            <option value="7776000">{{create.expiry.90days}}</option>
                            <option value="">{{expiry.none}}</option>
                        </select>
                    </div>
                    <div class="cb-create-field" role="group" aria-labelledby="create-burn-label">
                        <span class="cb-label" id="create-burn-label">{{create.burnLabel}}</span>
                        <label class="cb-check cb-create-burn">
                            <input type="checkbox" id="create-burn" />
                            <span>{{create.burn}}</span>
                        </label>
                    </div>
                    <div class="cb-create-field cb-create-field-wide">
                        <label class="cb-label" for="create-password">{{create.password}}</label>
                        <input
                            type="password"
                            id="create-password"
                            class="cb-input"
                            placeholder="{{create.passwordPlaceholder}}"
                            autocomplete="new-password"
                            aria-describedby="create-password-error create-password-note"
                            form="create-password-form"
                        />
                    </div>
                </div>
                <p class="cb-label-note" id="create-password-note" data-password-note hidden>
                    {{create.passwordNote}}
                </p>
                <p class="cb-error" id="create-password-error" data-password-error hidden></p>
                <div class="cb-create-submit">
                    <button type="submit" class="cb-btn" data-create-submit>
                        {{create.submit}}
                    </button>
                    <p class="cb-create-trust" data-trust-line>{{create.lede}}</p>
                </div>
            </form>
            <!-- The capsule password belongs to this form (form="create-password-form"),
                 not to the create form: password managers pair a password field with the
                 text field before it in the same form as a login, and offered the item
                 name as a username. Enter in the field still creates the capsule. -->
            <form id="create-password-form" data-password-form novalidate hidden></form>
        </template>

        <template id="tmpl-token">
            <h1 class="cb-h1">{{create.heading}}</h1>
            <p class="cb-callout" role="status" data-token-notice hidden></p>
            <p class="cb-lede">{{create.token.required}}</p>
            <div data-token-slot></div>
        </template>

        <template id="tmpl-token-choice">
            <h1 class="cb-h1">{{create.heading}}</h1>
            <p class="cb-lede">{{create.token.otherInvited}}</p>
            <div class="cb-token-choice">
                <button type="button" class="cb-btn" data-token-keep>{{create.token.keep}}</button>
                <button type="button" class="cb-btn cb-btn-ghost" data-token-use-invited>
                    {{create.token.useInvited}}
                </button>
            </div>
        </template>

        <template id="tmpl-token-form">
            <form class="cb-form" data-token-form novalidate>
                <label class="cb-label" for="creation-token">{{create.token.label}}</label>
                <input
                    id="creation-token"
                    class="cb-input"
                    type="password"
                    autocomplete="off"
                    spellcheck="false"
                    aria-describedby="creation-token-error"
                    data-token-input
                />
                <p class="cb-error" id="creation-token-error" data-token-error hidden></p>
                <label class="cb-check">
                    <input type="checkbox" checked data-token-remember />
                    <span>{{create.token.remember}}</span>
                </label>
                <p>
                    <button type="submit" class="cb-btn" data-token-submit>
                        {{create.token.continue}}
                    </button>
                </p>
            </form>
        </template>

        <template id="tmpl-disabled">
            <h1 class="cb-h1">{{create.disabled.heading}}</h1>
            <p class="cb-lede">{{create.disabled.text}}</p>
        </template>

        <template id="tmpl-encrypting">
            <div class="cb-create-state">
                <span data-hexagon-slot></span>
                <h1 class="cb-h1">{{create.encrypting}}</h1>
                <p class="cb-lede">{{create.encryptingLede}}</p>
            </div>
        </template>

        <template id="tmpl-done">
            <div class="cb-sealed">
                <div class="cb-sealed-head">
                    <span data-hexagon-slot></span>
                    <div class="cb-sealed-title">
                        <h1 class="cb-h1">{{create.done}}</h1>
                        <ul class="cb-chips" data-summary></ul>
                    </div>
                </div>
                <div class="cb-link-panel">
                    <p class="cb-sealed-link" id="share-link" data-share-link></p>
                    <div class="cb-sealed-row">
                        <p class="cb-sealed-note">{{create.keyNote}}</p>
                        <button type="button" class="cb-btn" data-copy="share-link">
                            <span>{{create.copyLink}}</span>
                        </button>
                    </div>
                </div>
                <div class="cb-sealed-delete" data-delete-row>
                    <div class="cb-sealed-delete-text">
                        <strong>{{create.deleteLink}}</strong>
                        <span
                            class="cb-sealed-delete-link"
                            id="delete-link"
                            data-delete-link
                        ></span>
                        <span class="cb-sealed-note">{{create.deleteLinkNote}}</span>
                    </div>
                    <button
                        type="button"
                        class="cb-btn cb-btn-ghost cb-btn-sm"
                        data-copy="delete-link"
                    >
                        <span>{{create.copy}}</span>
                    </button>
                </div>
                <p>
                    <a href="{{prefix}}/" class="cb-sealed-another">{{create.another}}</a>
                </p>
            </div>
        </template>

        <template id="tmpl-error">
            <div class="cb-create-state">
                <span data-hexagon-slot></span>
                <h1 class="cb-h1">{{create.error}}</h1>
                <p class="cb-lede" data-error-message></p>
                <div data-token-slot></div>
                <!-- Shown only when the create may have stored the capsule anyway. -->
                <div class="cb-sealed-delete" data-unclear hidden>
                    <div class="cb-sealed-delete-text">
                        <strong>{{create.deleteLink}}</strong>
                        <span class="cb-sealed-delete-link" data-unclear-delete-link></span>
                        <span class="cb-sealed-note"
                            >{{create.unclearNote}}
                            <span data-unclear-retry hidden>{{create.unclearRetryNote}}</span></span
                        >
                    </div>
                    <button type="button" class="cb-btn cb-btn-ghost cb-btn-sm" data-unclear-copy>
                        <span>{{create.copy}}</span>
                    </button>
                </div>
                <p class="cb-create-actions">
                    <button type="button" class="cb-btn" data-try-again hidden>
                        {{create.tryAgain}}
                    </button>
                    <button type="button" class="cb-btn" data-retry-btn>{{create.retry}}</button>
                </p>
            </div>
        </template>
    </body>
</html>
