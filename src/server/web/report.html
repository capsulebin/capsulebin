<!doctype html>
<html lang="{{lang}}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <meta name="referrer" content="no-referrer" />
        <title>{{shell.reportContent}} · CapsuleBin</title>
        <!--capsulebin:languages-->
        <script src="/language-init.js"></script>
        <script src="/theme-init.js"></script>
        <script type="module" src="/src/pages/report.ts"></script>
    </head>
    <body>
        <header class="cb-head">
            <a class="cb-logo" href="/{{lang}}/">
                <svg width="18" height="20" viewBox="0 0 18 20" fill="none" aria-hidden="true">
                    <path
                        d="M9 1.2 16.4 5.4v9.2L9 18.8 1.6 14.6V5.4L9 1.2Z"
                        stroke="currentColor"
                        stroke-width="1.6"
                    />
                    <path
                        d="M6.2 9.4h5.6v4.2H6.2V9.4Zm1.1 0V7.9a1.7 1.7 0 0 1 3.4 0v1.5"
                        stroke="currentColor"
                        stroke-width="1.3"
                    />
                </svg>
                CapsuleBin
            </a>
            <span class="cb-claim">{{shell.reportContent}}</span>
            <span class="cb-push cb-head-tools">
                <nav
                    class="cb-segmented cb-lang"
                    aria-label="{{shell.language}}"
                    data-language-switch
                    hidden
                ></nav>
                <button
                    type="button"
                    class="cb-btn-icon"
                    data-theme-toggle
                    aria-label="{{theme.switch}}"
                >
                    ◐
                </button>
            </span>
        </header>

        <main class="cb-main" data-report-root></main>

        <noscript>
            <div class="cb-main">
                <h1 class="cb-h1">{{shell.reportContent}}</h1>
                <p class="cb-lede">{{report.noscript}}</p>
            </div>
        </noscript>

        <template id="tmpl-form">
            <h1 class="cb-h1">{{shell.reportContent}}</h1>
            <div class="cb-callout">
                <strong>{{report.idOnly}}</strong>
                <p class="cb-lede">{{report.keyBefore}} <code>#</code> {{report.keyAfter}}</p>
            </div>
            <p class="cb-lede">{{report.lede}}</p>
            <form class="cb-form" data-report-form novalidate>
                <div>
                    <label class="cb-label" for="report-paste">{{report.paste}}</label>
                    <input
                        type="text"
                        id="report-paste"
                        class="cb-input"
                        autocomplete="off"
                        spellcheck="false"
                        required
                        data-report-paste
                    />
                    <span class="cb-label-note">{{report.pasteNote}}</span>
                </div>
                <div>
                    <label class="cb-label" for="report-reason">{{report.reason}}</label>
                    <select
                        id="report-reason"
                        class="cb-input cb-select"
                        required
                        data-report-reason
                    >
                        <option value="illegal_content">{{report.reason.illegal_content}}</option>
                        <option value="malware">{{report.reason.malware}}</option>
                        <option value="phishing">{{report.reason.phishing}}</option>
                        <option value="spam">{{report.reason.spam}}</option>
                        <option value="personal_data">{{report.reason.personal_data}}</option>
                        <option value="copyright">{{report.reason.copyright}}</option>
                        <option value="other">{{report.reason.other}}</option>
                    </select>
                </div>
                <div>
                    <label class="cb-label" for="report-description">{{report.description}}</label>
                    <textarea
                        id="report-description"
                        class="cb-input cb-textarea"
                        maxlength="4000"
                        required
                        data-report-description
                    ></textarea>
                </div>
                <div>
                    <label class="cb-label" for="report-contact">{{report.contact}}</label>
                    <input
                        type="text"
                        id="report-contact"
                        class="cb-input"
                        maxlength="254"
                        autocomplete="email"
                        data-report-contact
                    />
                    <span class="cb-label-note">{{report.contactNote}}</span>
                </div>
                <p class="cb-error" data-report-error hidden></p>
                <div class="cb-form-actions">
                    <button type="submit" class="cb-btn" data-report-submit>
                        {{report.submit}}
                    </button>
                </div>
            </form>
            <p class="cb-lede" data-report-contact-note hidden>
                {{report.writeBefore}}
                <span data-report-contact-address></span>{{report.writeAfter}}
            </p>
        </template>

        <template id="tmpl-sent">
            <h1 class="cb-h1">{{report.sent}}</h1>
            <p class="cb-lede">{{report.sentLede}}</p>
            <p><a href="/{{lang}}/" class="cb-btn">{{report.back}}</a></p>
        </template>

        <template id="tmpl-disabled">
            <h1 class="cb-h1">{{report.disabled}}</h1>
            <p class="cb-lede" data-disabled-message>{{report.disabledLede}}</p>
        </template>

        <footer class="cb-foot">
            <span>{{report.footer}}</span>
            <span class="cb-push cb-foot-links"><!--capsulebin:legal-links--></span>
        </footer>
    </body>
</html>
