<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <meta name="referrer" content="no-referrer" />
        <title>Report content · CapsuleBin</title>
        <script src="/theme-init.js"></script>
        <script type="module" src="/src/pages/report.ts"></script>
    </head>
    <body>
        <header class="cb-head">
            <a class="cb-logo" href="/">
                <svg width="18" height="20" viewBox="0 0 18 20" fill="none" aria-hidden="true">
                    <path
                        d="M9 1.2 16.4 5.4v9.2L9 18.8 1.6 14.6V5.4L9 1.2Z"
                        stroke="currentColor"
                        stroke-width="1.6"
                    />
                    <path
                        d="M6.2 9.4h5.6v4.2H6.2V9.4Zm1.1 0V7.9a1.7 1.7 0 0 1 3.4 0v1.5"
                        stroke="currentColor"
                        stroke-width="1.3"
                    />
                </svg>
                CapsuleBin
            </a>
            <span class="cb-claim">Report content</span>
            <button
                type="button"
                class="cb-btn-icon cb-push"
                data-theme-toggle
                aria-label="Switch theme"
            >
                ◐
            </button>
        </header>

        <main class="cb-main" data-report-root></main>

        <noscript>
            <div class="cb-main">
                <h1 class="cb-h1">Report content</h1>
                <p class="cb-lede">
                    The report form needs JavaScript. You can also reach the operator at the address
                    given in the site notice.
                </p>
            </div>
        </noscript>

        <template id="tmpl-form">
            <h1 class="cb-h1">Report content</h1>
            <div class="cb-callout">
                <strong>Send the paste id only, never the full link.</strong>
                <p class="cb-lede">
                    Everything after the <code>#</code> in a link is the decryption key. This form
                    strips it before sending and refuses text that contains one. Do not include it
                    in screenshots either.
                </p>
            </div>
            <p class="cb-lede">
                Content on this service is encrypted; the operator cannot read it and does not need
                to. A report lets the operator block or remove the capsule by its id.
            </p>
            <form class="cb-form" data-report-form novalidate>
                <div>
                    <label class="cb-label" for="report-paste">Link or paste id</label>
                    <input
                        type="text"
                        id="report-paste"
                        class="cb-input"
                        autocomplete="off"
                        spellcheck="false"
                        required
                        data-report-paste
                    />
                    <span class="cb-label-note">The part after # is removed before sending.</span>
                </div>
                <div>
                    <label class="cb-label" for="report-reason">Reason</label>
                    <select
                        id="report-reason"
                        class="cb-input cb-select"
                        required
                        data-report-reason
                    >
                        <option value="illegal_content">Illegal content</option>
                        <option value="malware">Malware</option>
                        <option value="phishing">Phishing or fraud</option>
                        <option value="spam">Spam</option>
                        <option value="personal_data">
                            Personal data published without consent
                        </option>
                        <option value="copyright">Copyright infringement</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="cb-label" for="report-description">What is wrong with it?</label>
                    <textarea
                        id="report-description"
                        class="cb-input cb-textarea"
                        maxlength="4000"
                        required
                        data-report-description
                    ></textarea>
                </div>
                <div>
                    <label class="cb-label" for="report-contact">Your contact (optional)</label>
                    <input
                        type="text"
                        id="report-contact"
                        class="cb-input"
                        maxlength="254"
                        autocomplete="email"
                        data-report-contact
                    />
                    <span class="cb-label-note">Only if you want to hear back.</span>
                </div>
                <p class="cb-error" data-report-error hidden></p>
                <div class="cb-form-actions">
                    <button type="submit" class="cb-btn" data-report-submit>Send report</button>
                </div>
            </form>
            <p class="cb-lede" data-report-contact-note hidden>
                You can also write to <span data-report-contact-address></span>.
            </p>
        </template>

        <template id="tmpl-sent">
            <h1 class="cb-h1">Report received</h1>
            <p class="cb-lede">
                Thank you. The operator reviews reports and can block or remove a capsule without
                decrypting it.
            </p>
            <p><a href="/" class="cb-btn">Back to CapsuleBin</a></p>
        </template>

        <template id="tmpl-disabled">
            <h1 class="cb-h1">Reports are not accepted here</h1>
            <p class="cb-lede" data-disabled-message>
                This instance does not accept reports through this form. Please use the address
                given in the site notice.
            </p>
        </template>

        <footer class="cb-foot">
            <span>Reports are handled without decrypting anything.</span>
            <span class="cb-push cb-foot-links"><!--capsulebin:legal-links--></span>
        </footer>
    </body>
</html>
