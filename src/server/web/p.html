<!doctype html>
<html lang="{{lang}}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <meta name="referrer" content="no-referrer" />
        <title>{{view.title}} · CapsuleBin</title>
        <meta name="capsulebin-languages" content="{{languages}}" data-default="{{default}}" />
        <script src="/language-init.js"></script>
        <script src="/theme-init.js"></script>
        <script type="module" src="/src/pages/view.ts"></script>
    </head>
    <body>
        <header class="cb-head">
            <a class="cb-logo" href="/{{lang}}/">
                <svg width="18" height="20" viewBox="0 0 18 20" fill="none" aria-hidden="true">
                    <path
                        d="M9 1.2 16.4 5.4v9.2L9 18.8 1.6 14.6V5.4L9 1.2Z"
                        stroke="currentColor"
                        stroke-width="1.6"
                    />
                    <path
                        d="M6.2 9.4h5.6v4.2H6.2V9.4Zm1.1 0V7.9a1.7 1.7 0 0 1 3.4 0v1.5"
                        stroke="currentColor"
                        stroke-width="1.3"
                    />
                </svg>
                CapsuleBin
            </a>
            <span class="cb-push cb-head-tools">
                <nav
                    class="cb-segmented"
                    aria-label="{{shell.language}}"
                    data-language-switch
                    hidden
                ></nav>
                <button
                    type="button"
                    class="cb-btn-icon"
                    data-theme-toggle
                    aria-label="{{theme.switch}}"
                >
                    ◐
                </button>
            </span>
        </header>

        <main class="cb-main cb-center" data-view-root><cb-view-page></cb-view-page></main>

        <noscript>
            <div class="cb-main cb-center">
                <h1 class="cb-h1">{{shell.needsJavaScript}}</h1>
                <p class="cb-lede">{{view.noscript}}</p>
            </div>
        </noscript>

        <footer class="cb-foot">
            <span>{{view.footer}}</span>
            <span class="cb-push cb-foot-links">
                <a href="/{{lang}}/report">{{shell.reportContent}}</a>
                <!--capsulebin:legal-link:imprint:{{shell.imprint}}-->
                <!--capsulebin:legal-link:privacy:{{shell.privacy}}-->
                <!--capsulebin:legal-link:terms:{{shell.terms}}-->
            </span>
        </footer>
    </body>
</html>
