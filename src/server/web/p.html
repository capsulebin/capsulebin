<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <meta name="referrer" content="no-referrer" />
        <title>Open capsule · CapsuleBin</title>
        <script src="/theme-init.js"></script>
        <script type="module" src="/src/pages/view.ts"></script>
    </head>
    <body>
        <header class="cb-head">
            <a class="cb-logo" href="/">
                <svg width="18" height="20" viewBox="0 0 18 20" fill="none" aria-hidden="true">
                    <path
                        d="M9 1.2 16.4 5.4v9.2L9 18.8 1.6 14.6V5.4L9 1.2Z"
                        stroke="currentColor"
                        stroke-width="1.6"
                    />
                    <path
                        d="M6.2 9.4h5.6v4.2H6.2V9.4Zm1.1 0V7.9a1.7 1.7 0 0 1 3.4 0v1.5"
                        stroke="currentColor"
                        stroke-width="1.3"
                    />
                </svg>
                CapsuleBin
            </a>
            <button
                type="button"
                class="cb-btn-icon cb-push"
                data-theme-toggle
                aria-label="Switch theme"
            >
                ◐
            </button>
        </header>

        <main class="cb-main cb-center" data-view-root><cb-view-page></cb-view-page></main>

        <noscript>
            <div class="cb-main cb-center">
                <h1 class="cb-h1">This page needs JavaScript</h1>
                <p class="cb-lede">
                    CapsuleBin decrypts content exclusively in your browser. Without JavaScript
                    there is nowhere for that to happen — the server does not know the key and
                    cannot open the content for you.
                </p>
            </div>
        </noscript>

        <footer class="cb-foot">
            <span>Decryption happens locally.</span>
            <span class="cb-push"><a href="/report">Report content</a></span>
        </footer>
    </body>
</html>
